name: Jest coverage

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2

      - name: Install dependencies
        run: npm install

      - name: Detect Jest tests
        id: jest-tests
        shell: bash
        run: |
          test_list="$RUNNER_TEMP/jest-test-files.txt"
          npx jest --listTests > "$test_list"

          if [[ -s "$test_list" ]]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Jest coverage and generate test results
        if: steps.jest-tests.outputs.has_tests == 'true'
        run: npm run test:ci -- --coverage --json --outputFile=test-results.json

      - name: Skip Jest coverage
        if: steps.jest-tests.outputs.has_tests != 'true'
        run: echo "No Jest tests found; skipping coverage."

      - name: Upload Jest Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: petpet-test-results
          path: test-results.json
          if-no-files-found: warn
          retention-days: 10
